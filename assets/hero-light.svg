<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
<title id="t">figma-cli: talk in plain English, watch Figma build</title>
<desc id="d">A sentence typed to an AI assistant, "Create three pricing cards.", passes through figma-cli on your machine and becomes three real, editable pricing card components in Figma Desktop.</desc>
<rect width="1280" height="500" fill="#F6F5F1"/>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#D6D2C8"/></pattern></defs>
<rect x="724" y="0" width="556" height="500" fill="url(#g)"/>
<text x="72" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" fill="#C7390F" text-anchor="start">figma-cli</text>
<text x="72" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#16151A" text-anchor="start" letter-spacing="-1.2">Talk in plain English.</text>
<text x="72" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#16151A" text-anchor="start" letter-spacing="-1.2">Watch Figma build.</text>
<text x="72" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5E5B66" text-anchor="start">Your AI assistant builds real frames, components and</text>
<text x="72" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5E5B66" text-anchor="start">variables in Figma Desktop. Locally, with no API key</text>
<text x="72" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5E5B66" text-anchor="start">and no rate limits.</text>
<text x="72" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6F6B62" text-anchor="start">Works in</text>
